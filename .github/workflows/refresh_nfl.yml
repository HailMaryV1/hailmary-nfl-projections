name: Refresh NFL Projections

on:
  schedule:
    # Every 6 hours. RotoWire and Spreadex both have real bot-protection
    # (Cloudflare) - a modest cadence, not tight polling, per the scrapers'
    # own module docstrings.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # Same resilience pattern as Dream Team Projections' own workflow:
      # a transient scraper hiccup shouldn't block compute_projections.py
      # from still running against whatever real data IS already in the DB.
      #
      # FanTeam is skipped here on purpose, not because it's flaky: their
      # own API returns a real, persistent 401 to GitHub's shared runner
      # IPs (confirmed 2026-09-08, every automated attempt), and unlike
      # RotoWire/FIC there's nothing time-sensitive to miss by skipping it -
      # FanTeam player prices have never changed once. Run it manually
      # (scrape_fanteam.py + import_fanteam.py) when a new gameweek's
      # fixtures need pulling in, or to capture real gameweek points.
      - name: Data ingestion
        id: ingestion
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_nfl.py --skip fanteam

      - name: Compute projections
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/compute_projections.py

      # Freeze/capture pair (ported from the sibling EFL-Projections repo):
      # freeze snapshots this run's horizon=1 projection permanently before
      # it can change again; capture fills in the real result once a
      # player's game has actually finished. Both are idempotent, safe to
      # run unconditionally every 6 hours. Note: capture only has real
      # actuals to find once someone has manually run
      # scrape_fanteam_stats.py + import_fanteam_stats.py (excluded from
      # this automated workflow, same as the rest of FanTeam - see the
      # "Data ingestion" step's own comment above) - until then it's a
      # harmless no-op.
      - name: Freeze predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/freeze_predictions.py

      - name: Capture actuals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/capture_actuals.py

      - name: Fail the run if data ingestion had a real problem
        if: steps.ingestion.outcome == 'failure'
        run: |
          echo "Data ingestion reported a failure - check the 'Data ingestion' step's own log above for which script failed."
          exit 1
